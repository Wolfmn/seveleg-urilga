<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>preview.jpg</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#e8e0c8; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:"Noto Sans Mongolian","Mongolian Baiti",serif; }
    .card {
      width:1200px; height:630px;
      background:linear-gradient(180deg,#fff9e6,#fff5d6);
      border:14px solid #d4af37; border-radius:32px;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px 70px; text-align:center;
      box-shadow:inset 0 0 80px rgba(212,175,55,0.1), 0 12px 40px rgba(139,69,19,0.18);
    }
    .ornament { color:#d4af37; font-size:44px; letter-spacing:14px; margin-bottom:12px; opacity:0.65; }
    h1 { color:#8b4513; font-size:62px; font-weight:bold; margin-bottom:26px; letter-spacing:2px; line-height:1.4; }
    .names { color:#a05a20; font-size:38px; margin-bottom:32px; line-height:1.7; }
    .info { color:#5a3e1b; font-size:30px; line-height:2.1; background:rgba(255,248,220,0.75); padding:26px 50px; border-radius:14px; border-left:5px solid #d4af37; border-right:5px solid #d4af37; }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament">✦ ✦ ✦</div>
    <h1>💛 Сэвлэг Үргээх Ёслолын Урилга 💛</h1>
    <div class="names">Сод-Од · Нарансувд хоёрын<br>сэвлэг үргээх ёслолд таныг урьж байна</div>
    <div class="info">
      📅 2026 оны 8-р сарын 26 · Лхагва гараг<br>
      ⏰ 10:30 цагт<br>
      📍 Буян-Ухаа 2 хороолол, 1039-р байр, 49-р тоот<br>
      Улаанбаатар хот, Хан-Уул дүүрэг
    </div>
    <div class="ornament" style="margin-top:28px;">✦ ✦ ✦</div>
  </div>
</body>
</html>
